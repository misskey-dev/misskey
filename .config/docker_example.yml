#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Misskey configuration
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#   ┌─────┐
#───┘ URL └─────────────────────────────────────────────────────

# Final accessible URL seen by a user.
# You can set url from an environment variable instead.
url: https://example.tld/

# ONCE YOU HAVE STARTED THE INSTANCE, DO NOT CHANGE THE
# URL SETTINGS AFTER THAT!

#   ┌───────────────────────┐
#───┘ Port and TLS settings └───────────────────────────────────

#
# Misskey requires a reverse proxy to support HTTPS connections.
#
#                 +----- https://example.tld/ ------------+
#   +------+      |+-------------+      +----------------+|
#   | User | ---> || Proxy (443) | ---> | Misskey (3000) ||
#   +------+      |+-------------+      +----------------+|
#                 +---------------------------------------+
#
#   You need to set up a reverse proxy. (e.g. nginx)
#   An encrypted connection with HTTPS is highly recommended
#   because tokens may be transferred in GET requests.

# The port that your Misskey server should listen on.
port: 3000

#   ┌──────────────────────────┐
#───┘ PostgreSQL configuration └────────────────────────────────

db:
  host: db
  port: 5432

  # Database name
  # You can set db from an environment variable instead.
  db: misskey

  # Auth
  # You can set user and pass from environment variables instead.
  user: example-misskey-user
  pass: example-misskey-pass

  # Whether disable Caching queries
  #disableCache: true

  # Extra Connection options
  #extra:
  #  ssl: true

dbReplications: false

# You can configure any number of replicas here
#dbSlaves:
#  -
#    host:
#    port:
#    db:
#    user:
#    pass:
#  -
#    host:
#    port:
#    db:
#    user:
#    pass:

#   ┌─────────────────────┐
#───┘ Redis configuration └─────────────────────────────────────

redis:
  host: redis
  port: 6379
  #family: 0  # 0=Both, 4=IPv4, 6=IPv6
  #pass: example-pass
  #prefix: example-prefix
  #db: 1

#redisForPubsub:
#  host: redis
#  port: 6379
#  #family: 0  # 0=Both, 4=IPv4, 6=IPv6
#  #pass: example-pass
#  #prefix: example-prefix
#  #db: 1

#redisForJobQueue:
#  host: redis
#  port: 6379
#  #family: 0  # 0=Both, 4=IPv4, 6=IPv6
#  #pass: example-pass
#  #prefix: example-prefix
#  #db: 1

#redisForTimelines:
#  host: redis
#  port: 6379
#  #family: 0  # 0=Both, 4=IPv4, 6=IPv6
#  #pass: example-pass
#  #prefix: example-prefix
#  #db: 1

#redisForReactions:
#  host: redis
#  port: 6379
#  #family: 0  # 0=Both, 4=IPv4, 6=IPv6
#  #pass: example-pass
#  #prefix: example-prefix
#  #db: 1

#   ┌───────────────────────────────┐
#───┘ Fulltext search configuration └─────────────────────────────

# These are the setting items for the full-text search provider.
fulltextSearch:
  # You can select the ID generation method.
  # - sqlLike (default)
  #   Use SQL-like search.
  #   This is a standard feature of PostgreSQL, so no special extensions are required.
  # - sqlPgroonga
  #   Use pgroonga.
  #   You need to install pgroonga and configure it as a PostgreSQL extension.
  #   In addition to the above, you need to create a pgroonga index on the text column of the note table.
  #   see: https://pgroonga.github.io/tutorial/
  # - meilisearch
  #   Use Meilisearch.
  #   You need to install Meilisearch and configure.
  provider: sqlLike

# For Meilisearch settings.
# If you select "meilisearch" for "fulltextSearch.provider", it must be set.
# You can set scope to local (default value) or global
# (include notes from remote).

#meilisearch:
#  host: meilisearch
#  port: 7700
#  apiKey: ''
#  ssl: true
#  index: ''
#  scope: local

#   ┌───────────────┐
#───┘ ID generation └───────────────────────────────────────────

# You can select the ID generation method.
# You don't usually need to change this setting, but you can
# change it according to your preferences.

# Available methods:
# aid ... Short, Millisecond accuracy
# aidx ... Millisecond accuracy
# meid ... Similar to ObjectID, Millisecond accuracy
# ulid ... Millisecond accuracy
# objectid ... This is left for backward compatibility

# ONCE YOU HAVE STARTED THE INSTANCE, DO NOT CHANGE THE
# ID SETTINGS AFTER THAT!

id: 'aidx'

#   ┌────────────────┐
#───┘ Error tracking └──────────────────────────────────────────

# Sentry is available for error tracking.
# See the Sentry documentation for more details on options.
#
# Data sent to Sentry follows the Sentry SDK's own default behavior and is
# governed by your Sentry configuration below (and by Sentry's own product
# defaults -- e.g. parameterized SQL statements, exception messages and
# stack traces with source context, and request/host metadata). Misskey does
# not filter or reduce what Sentry itself receives; if you need to limit
# that, use Sentry's own options (see the Sentry Node SDK docs) or your
# organization's Sentry data scrubbing settings.
#
# One exception: the tracePropagationTargets default ([]) and the
# propagateTraceToRemote startup check further below govern what Misskey
# sends to third-party remote hosts (federated ActivityPub inboxes, webhook
# targets), not what Sentry itself receives. They do not filter or reduce
# anything Sentry collects.

# Uncomment the properties below to enable Sentry for the backend.

#sentryForBackend:
#  # ------------------------------------------------------------
#  # Enables @sentry/profiling-node's CPU profiler.
#  # ------------------------------------------------------------

#  enableNodeProfiling: true

#  # ------------------------------------------------------------
#  # Specify Sentry integration names to disable individual auto-instrumentation.
#  # The names are integration .name values, not factory function names.
#  # To check enabled names, set `options.debug: true` and see
#  # "Integration installed: <name>" in the Sentry logs.
#  #
#  # As of 2026-07-07 / @sentry/node 10.62.0, useful names for Misskey include:
#  #   Postgres    ... DB queries (when pg is externalized)
#  #   Redis       ... ioredis commands
#  #   Fastify     ... inbound HTTP routes
#  #   Http        ... inbound/outbound HTTP; disabling this can also affect request isolation
#  #   NodeFetch   ... fetch/undici requests
#  #   RequestData ... copies the raw request (URL, headers, body) onto event.request
#  # ------------------------------------------------------------

#  disabledIntegrations: ['Postgres']

#  options:
#    dsn: 'https://examplePublicKey@o0.ingest.sentry.io/0'

#    # ------------------------------------------------------------
#    # By default, Misskey prevents Sentry trace headers (`sentry-trace` and
#    # `baggage`) from being sent to remote ActivityPub/Webhook/etc. hosts.
#    # This is not about what Sentry itself receives -- it is about what
#    # Misskey sends to third-party remote hosts. The outgoing baggage
#    # carries the Sentry project's public key (the only credential needed
#    # to send events into that project), so propagating it to arbitrary
#    # federated/webhook targets would hand out a credential to them.
#    # To intentionally propagate distributed traces to trusted internal services,
#    # list only those internal URL patterns here.
#    # Avoid broad patterns that match remote servers unless you intentionally
#    # want to restore Sentry's legacy behavior of propagating traces to all
#    # outbound HTTP requests.
#    # ------------------------------------------------------------

#    #tracePropagationTargets: []

#    # ------------------------------------------------------------
#    # Internal allowlist example:
#    # ------------------------------------------------------------

#    #tracePropagationTargets:
#    #  - 'internal-service.example'

#   ┌─────────┐
#───┘ Tracing └────────────────────────────────────────────────
# OpenTelemetry distributed tracing (Traces only, opt-in).
# Existing API and Queue spans are exported to an OTLP http/protobuf endpoint.
#
# In OTel-only mode (sentryForBackend not configured), the resource sent to
# your collector always includes service.instance.id (hostname:pid) so you
# can tell processes apart.
#
# Standard OTEL_* environment variables are honored for values omitted below:
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, OTEL_EXPORTER_OTLP_ENDPOINT,
# OTEL_EXPORTER_OTLP_HEADERS, OTEL_TRACES_SAMPLER, OTEL_TRACES_SAMPLER_ARG, etc.
#
# When this is enabled together with sentryForBackend, Misskey shares Sentry's
# TracerProvider and adds an OTLP SpanProcessor to it. In that mode:
# - sampleRate below is ignored; sampling follows sentryForBackend.options
#   tracesSampleRate / tracesSampler.
# - resourceAttributes below is ignored; set OTEL_SERVICE_NAME and
#   OTEL_RESOURCE_ATTRIBUTES in the environment if you need to override them.
#   Note that keys declared this way are still not exported to OTLP in this
#   mode: only a fixed set of resource attribute keys (service.*,
#   telemetry.sdk.*, process.runtime.*, misskey.process.role) passes the
#   OTLP export filter when sentryForBackend is configured.
# - Sentry integrations stay enabled; whether any of their spans reach OTLP is
#   governed entirely by sentryAutoInstrumentationExport below (default
#   'none' exports none of them), not by disabling the integration itself.
#   'safe' is a precondition checked uniformly before the PostgreSQL/Redis/HTTP
#   branches below: with 'none', none of the capture* flags have any effect on
#   what reaches OTLP, no matter which are enabled.
# - sentry-trace / baggage propagation to outbound remote requests is disabled
#   by default. Setting propagateTraceToRemote: true requires an explicit
#   sentryForBackend.options.tracePropagationTargets (see above); startup
#   fails otherwise. This is enforced because the outgoing baggage carries
#   the Sentry project's public key (the only credential needed to send
#   events into that project), plus org_id, environment, release and the
#   transaction name -- propagating that to untrusted remotes (every
#   federated ActivityPub inbox, every webhook target) hands out a
#   credential.

# Uncomment the properties below to enable OpenTelemetry for the backend.

#otelForBackend:
#  endpoint: 'http://localhost:4318/v1/traces'

#  #headers:
#  #  authorization: 'Bearer xxxxx'

#  #sampleRate: 1.0

#  # ------------------------------------------------------------
#  # Record PostgreSQL query spans.
#  #
#  # OTel-only: disabled by default to avoid instrumentation overhead when
#  # database-level diagnostics are not needed; the instrumentation itself is
#  # only installed while this is true.
#  #
#  # Combined with sentryForBackend: Sentry's own PostgreSQL integration
#  # instruments queries either way, so this flag does not control overhead
#  # in this mode -- it only selects whether those spans are additionally
#  # re-exported to your OTLP collector (also requires
#  # sentryAutoInstrumentationExport: 'safe', see below). To avoid the
#  # instrumentation overhead itself here, disable Sentry's own integration
#  # via sentryForBackend.disabledIntegrations: ['Postgres'].
#  # ------------------------------------------------------------

#  #capturePgSpans: false

#  # ------------------------------------------------------------
#  # Include SQL statement text (db.statement / db.query.text) on PostgreSQL
#  # spans. Requires capturePgSpans. Disabled by default: statement text adds
#  # a meaningful amount of payload volume, and non-parameterized queries can
#  # embed values.
#  #
#  # This setting is OTLP-only routing: it only controls whether the text
#  # reaches span attributes on the OTLP export -- the collector configured
#  # in endpoint above. It is wired only into the OTLP span processor and has
#  # no effect on Sentry. What Sentry's own PostgreSQL instrumentation
#  # collects and sends is entirely up to Sentry's own SDK behavior and your
#  # Sentry configuration, independent of this flag.
#  #
#  # With sentryForBackend also configured, the text additionally requires
#  # capturePgSpans: true and sentryAutoInstrumentationExport: 'safe' to
#  # reach OTLP at all. In OTel-only mode, capturePgStatement: false instead
#  # replaces the statement with '[REDACTED]' at collection time.
#  #
#  # What is exported here is truncated to 8 KiB UTF-8 on a character
#  # boundary, with NUL, CR, LF and ESC control characters removed. Bind
#  # parameter values are never included, in any configuration.
#  # ------------------------------------------------------------

#  #capturePgStatement: false

#  # ------------------------------------------------------------
#  # Include PostgreSQL connection-pool spans with an existing parent span.
#  # Requires capturePgSpans.
#  #
#  # OTel-only: disabled by default to avoid noisy spans from connection
#  # churn.
#  #
#  # Combined with sentryForBackend: same re-export-only caveat as
#  # capturePgSpans above -- use sentryForBackend.disabledIntegrations:
#  # ['Postgres'] to avoid the underlying instrumentation overhead in this
#  # mode.
#  # ------------------------------------------------------------

#  #capturePgConnectionSpans: false

#  # ------------------------------------------------------------
#  # Record Redis command spans.
#  #
#  # OTel-only: disabled by default because subscribing to the ioredis
#  # diagnostics channel adds work to every Redis command, including commands
#  # without a parent span. Enable for development diagnostics or when the
#  # added overhead is acceptable in production.
#  #
#  # Combined with sentryForBackend: Sentry's own Redis integration
#  # instruments commands either way, so this flag only selects whether those
#  # spans are additionally re-exported to your OTLP collector (also requires
#  # sentryAutoInstrumentationExport: 'safe', see below). To avoid the
#  # instrumentation overhead itself here, disable Sentry's own integration
#  # via sentryForBackend.disabledIntegrations: ['Redis'].
#  # ------------------------------------------------------------

#  #captureRedisCommandSpans: false

#  # ------------------------------------------------------------
#  # Include Redis startup/reconnect spans; these spans are recorded even
#  # without an HTTP or job parent span.
#  #
#  # OTel-only: disabled by default to avoid noisy connection churn.
#  #
#  # Combined with sentryForBackend: same re-export-only caveat as
#  # captureRedisCommandSpans above -- use
#  # sentryForBackend.disabledIntegrations: ['Redis'] to avoid the underlying
#  # instrumentation overhead in this mode.
#  # ------------------------------------------------------------

#  #captureRedisConnectionSpans: false

#  # ------------------------------------------------------------
#  # Record Redis commands without an HTTP or job parent span. Only applies
#  # when captureRedisCommandSpans is enabled, in either mode below.
#  #
#  # OTel-only: disabled by default because queue polling and background work
#  # can produce many root traces.
#  #
#  # Combined with sentryForBackend: same re-export-only caveat as
#  # captureRedisCommandSpans above.
#  # ------------------------------------------------------------

#  #captureRedisRootSpans: false

#  #resourceAttributes:
#  #  deployment.environment: 'production'

#  # ------------------------------------------------------------
#  # See "sentry-trace / baggage propagation" above for the requirements that
#  # apply when this is combined with sentryForBackend.
#  # ------------------------------------------------------------

#  #propagateTraceToRemote: false

#  # ------------------------------------------------------------
#  # Queue worker spans are independent traces linked to their enqueuer by default.
#  # Set to 'parent' to make them child spans instead. This can create very large
#  # traces for high-fan-out queues such as federation delivery.
#  # ------------------------------------------------------------

#  #jobTraceContextMode: 'link'

#  # ------------------------------------------------------------
#  # When used with sentryForBackend, this is a precondition, not an add-on:
#  # with the default 'none', none of Sentry's own auto-instrumented spans
#  # (PostgreSQL, Redis, or HTTP server/client) reach your OTLP collector,
#  # even if the capture* flags above are enabled -- only Misskey's own spans
#  # are exported. Set to 'safe' to additionally allow supported Sentry
#  # scopes through: the capture* flags above then select which
#  # PostgreSQL/Redis scopes are exported, and HTTP server/client scopes are
#  # exported unconditionally once 'safe' is set. Unknown SDK spans remain
#  # blocked either way.
#  # ------------------------------------------------------------

#  #sentryAutoInstrumentationExport: 'none'

#sentryForFrontend:
#  vueIntegration:
#    tracingOptions:
#      trackComponents: true
#  browserTracingIntegration:
#  replayIntegration:
#  options:
#    dsn: 'https://examplePublicKey@o0.ingest.sentry.io/0'

#   ┌─────────────────────┐
#───┘ Other configuration └─────────────────────────────────────

# Whether disable HSTS
#disableHsts: true

# Number of worker processes
#clusterLimit: 1

# Number of threads of extra thread pool for CPU-intensive tasks (per worker)
#threadPoolSize: 1

# Job concurrency per worker
# deliverJobConcurrency: 128
# inboxJobConcurrency: 16

# Job rate limiter
# deliverJobPerSec: 128
# inboxJobPerSec: 32

# Job attempts
# deliverJobMaxAttempts: 12
# inboxJobMaxAttempts: 8

# IP address family used for outgoing request (ipv4, ipv6 or dual)
#outgoingAddressFamily: ipv4

# Proxy for HTTP/HTTPS
#proxy: http://127.0.0.1:3128

proxyBypassHosts:
  - api.deepl.com
  - api-free.deepl.com
  - www.recaptcha.net
  - hcaptcha.com
  - challenges.cloudflare.com

# Proxy for SMTP/SMTPS
#proxySmtp: http://127.0.0.1:3128   # use HTTP/1.1 CONNECT
#proxySmtp: socks4://127.0.0.1:1080 # use SOCKS4
#proxySmtp: socks5://127.0.0.1:1080 # use SOCKS5

# Media Proxy
#mediaProxy: https://example.com/proxy

# For security reasons, uploading attachments from the intranet is prohibited,
# but exceptions can be made from the following settings. Default value is "undefined".
# Read changelog to learn more (Improvements of 12.90.0 (2021/09/04)).
#allowedPrivateNetworks:
#  - '127.0.0.1/32'

# Upload or download file size limits (bytes)
#maxFileSize: 262144000

# Log settings
# logging:
#   # Log output format. "json" outputs one-line JSON; defaults to "pretty".
#   format: pretty
#   # Minimum level for all loggers. Defaults to info in production and debug otherwise.
#   level: info
#   # The longest matching logger domain takes precedence over the global level.
#   domains:
#     core.boot: info
#     queue: error
#     queue.deliver: debug
#     db.sql: off
#   # HTTP status classes to record in the access log. No output when unspecified.
#   access:
#     statusClasses:
#       - '2xx'
#       - '3xx'
#       - '4xx'
#       - '5xx'
#     # Enable body logging explicitly only during development.
#     bodies:
#       request: false
#       response: false
#       # 16 KiB by default, up to 128 KiB.
#       maxBytes: 16384
#   sql:
#     # Outputs query parameters during SQL execution to the log.
#     # default: false
#     enableQueryParamLogging: false
#     # Disable query truncation. If set to true, the full text of the query will be output to the log.
#     # default: false
#     disableQueryTruncation: false
