packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/i18n
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
  - packages-private/*
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  bufferutil: true
  canvas: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
  protobufjs: false
  pnpm: true
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - '@misskey-dev/*'
  - '@syuilo/aiscript'
  - buraha
  - mfm-js
  - slacc
  - slacc-android-arm-eabi
  - slacc-android-arm64
  - slacc-darwin-arm64
  - slacc-darwin-universal
  - slacc-darwin-x64
  - slacc-freebsd-x64
  - slacc-linux-arm-gnueabihf
  - slacc-linux-arm64-gnu
  - slacc-linux-arm64-musl
  - slacc-linux-x64-gnu
  - slacc-linux-x64-musl
  - slacc-win32-arm64-msvc
  - slacc-win32-x64-msvc
  - '@nestjs/common@12.4.2'
  - '@nestjs/core@12.4.2'
  - '@nestjs/testing@12.4.2'
  - '@fastify/otel@1.0.1'
  - '@opentelemetry/context-async-hooks@3.1.0'
  - '@opentelemetry/core@3.1.0'
  - '@opentelemetry/exporter-trace-otlp-proto@0.301.0'
  - '@opentelemetry/instrumentation-pg@0.78.0'
  - '@opentelemetry/instrumentation@0.301.0'
  - '@opentelemetry/otlp-exporter-base@0.301.0'
  - '@opentelemetry/otlp-transformer@0.301.0'
  - '@opentelemetry/resources@3.1.0'
  - '@opentelemetry/sdk-logs@3.1.0'
  - '@opentelemetry/sdk-metrics@3.1.0'
  - '@opentelemetry/sdk-trace@3.1.0'
  - '@opentelemetry/sql-common@0.43.1'
overrides:
  '@aiscript-dev/aiscript-languageserver': '-'
  chokidar: 5.0.0
  lodash: 4.18.1
  undici@^7: 7.30.1
  undici@^6: 6.29.1
  '@tabler/icons-webfont>sharp': '-'
engineStrict: true
saveExact: true
shellEmulator: true
