# this name is used in report-api-diff.yml so be careful when change name
name: Get api.json from Misskey

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - .github/workflows/get-api-diff.yml
jobs:
  get-from-misskey:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # head は PR をマージした結果 (github.sha = refs/pull/<番号>/merge のコミット)、
    # base はその第1親を使う。両 matrix job が同じ merge commit から比較対象を決めるので、
    # job の開始時刻がずれても base と head が食い違わない
    strategy:
      matrix:
        api-json-name: [api-base.json, api-head.json]
        include:
          - api-json-name: api-base.json
            use-merge-parent: true
          - api-json-name: api-head.json
            use-merge-parent: false

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2
        submodules: true
    - name: Switch to the merge commit's first parent
      if: matrix.use-merge-parent
      run: git checkout --detach HEAD^1
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .config/example.yml .config/default.yml
    - name: Build
      run: pnpm build
    - name: Generate API JSON
      run: pnpm --filter backend generate-api-json
    - name: Copy API.json
      run: cp packages/backend/built/api.json ${{ matrix.api-json-name }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: api-artifact-${{ matrix.api-json-name }}
        path: ${{ matrix.api-json-name }}

  save-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "$PR_NUMBER" > ./pr_number
      - uses: actions/upload-artifact@v7
        with:
          name: api-artifact-pr-number
          path: pr_number
