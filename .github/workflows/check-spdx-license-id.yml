name: Check SPDX-License-Identifier

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches-ignore:
      - master

jobs:
  check-spdx-license-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Check
        run: node scripts/check-spdx.mjs --ci
