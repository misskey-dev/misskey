name: Request release review

on:
  issue_comment:
    types: [created]

jobs:
  reply:
    # 改行や空白付きで投稿されても拾えるよう、ここでは軽く絞り込み、完全一致の判定はスクリプト内で trim して行う
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/request-release-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Reply
        uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.comment.body.trim() !== '/request-release-review') {
              console.log('Comment is not exactly /request-release-review; skipping')
              return
            }

            const body = `To dev team (@misskey-dev/dev):

            リリースが提案されています :rocket:

            GOの場合はapprove、NO GOの場合はその旨コメントをお願いいたします。

            判断にあたって考慮すべき観点は、

            - やり残したことはないか？
            - CHANGELOGは過不足ないか？
            - バージョンに問題はないか？(月跨いでいるのに更新忘れているなど)
            - 再考すべき仕様・実装はないか？
            - ベータ版を検証したサーバーから不具合の報告等は上がってないか？
            - (セキュリティの修正や重要なバグ修正などのため)リリースを急いだ方が良いか？そうではないか？
            - Actionsが落ちていないか？

            などが挙げられます。

            ご協力ありがとうございます :sparkles:
            `

            const issue_number = context.payload.issue ? context.payload.issue.number : (context.payload.pull_request && context.payload.pull_request.number)
            if (!issue_number) {
              console.log('No issue or PR number found in payload; skipping')
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            }
