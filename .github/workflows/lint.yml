name: Lint

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/i18n/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - packages/misskey-bubble-game/**
      - packages/misskey-reversi/**
      - packages/shared/oxlint-browser.js
      - scripts/check-dts*.mjs
      - .github/workflows/lint.yml
      - package.json
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/i18n/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - packages/misskey-bubble-game/**
      - packages/misskey-reversi/**
      - packages/shared/oxlint-browser.js
      - scripts/check-dts*.mjs
      - .github/workflows/lint.yml
      - package.json
jobs:
  pnpm_install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile

  lint:
    needs: [pnpm_install]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        workspace:
        - backend
        - frontend
        - frontend-shared
        - frontend-builder
        - frontend-embed
        - i18n
        - icons-subsetter
        - sw
        - misskey-js
        - misskey-bubble-game
        - misskey-reversi
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - run: pnpm --filter ${{ matrix.workspace }} run oxlint

  typecheck:
    needs: [pnpm_install]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        workspace:
        - backend
        - frontend
        - sw
        - misskey-js
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - run: pnpm --filter "${{ matrix.workspace }}^..." run build
    - run: pnpm --filter ${{ matrix.workspace }} run typecheck

  check-dts:
    needs: [pnpm_install]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - run: node --test scripts/check-dts.test.mjs
    - run: pnpm check-dts
