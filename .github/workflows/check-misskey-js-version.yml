name: Check Misskey JS version

on:
  push:
    branches: [ develop ]
    paths:
      - packages/misskey-js/package.json
      - packages/media-proxy-core/package.json
      - package.json
      - .github/workflows/check-misskey-js-version.yml
  pull_request:
    branches: [ develop ]
    paths:
      - packages/misskey-js/package.json
      - packages/media-proxy-core/package.json
      - package.json
      - .github/workflows/check-misskey-js-version.yml
jobs:
  check-version:
    # ルートの package.json と、本体とバージョンを揃えて公開するパッケージの package.json のバージョンが一致しているかを確認する
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check version
        run: |
          root_version="$(jq -r '.version' package.json)"
          for package_json in packages/misskey-js/package.json packages/media-proxy-core/package.json; do
            if [ "$root_version" != "$(jq -r '.version' "$package_json")" ]; then
              echo "Version mismatch! ($package_json)"
              exit 1
            fi
          done
