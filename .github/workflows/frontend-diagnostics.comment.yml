name: Frontend diagnostics (comment)

on:
  workflow_run:
    workflows:
      - Frontend diagnostics (inspect)
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment frontend diagnostics report
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-diagnostics-report-${{ github.event.workflow_run.pull_requests[0].number || format('{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) }}
      cancel-in-progress: true
    steps:
      - name: Resolve current pull request
        id: resolve-pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRun = context.payload.workflow_run;
            const associatedPullRequests = workflowRun.pull_requests ?? [];
            if (associatedPullRequests.length !== 1) {
              throw new Error(`Expected exactly one pull request for workflow run ${workflowRun.id}, got ${associatedPullRequests.length}.`);
            }

            const runPullRequest = associatedPullRequests[0];
            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: runPullRequest.number,
            });

            if (currentPullRequest.state !== 'open' || currentPullRequest.head.sha !== runPullRequest.head.sha) {
              core.notice(`Skipping stale frontend diagnostics report for pull request #${runPullRequest.number}.`);
              core.setOutput('is-current', 'false');
              return;
            }

            core.setOutput('is-current', 'true');
            core.setOutput('pr-number', String(runPullRequest.number));

      - name: Download frontend diagnostics report
        if: steps.resolve-pr.outputs.is-current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-diagnostics
          path: ${{ runner.temp }}/frontend-diagnostics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on pull request
        if: steps.resolve-pr.outputs.is-current == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.resolve-pr.outputs.pr-number }}
          comment-tag: frontend-diagnostics
          file-path: ${{ runner.temp }}/frontend-diagnostics/frontend-diagnostics.md
