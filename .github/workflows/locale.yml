name: Locale

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
  pull_request:
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
jobs:
  locale_verify:
    # develop -> master の PR は develop への push で検証済みなので重複実行しない
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'master' || github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter i18n build
      - name: Verify Locales
        working-directory: ./packages/i18n
        run: pnpm run verify
