name: Lint and test packages-private

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages-private/**
      - packages/shared/eslint.config.js
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/packages-private.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages-private/**
      - packages/shared/eslint.config.js
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/packages-private.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - diagnostics-shared
          - diagnostics-backend
          - diagnostics-frontend
          - changelog-checker
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          # 部分インストールのストアで full install 用のキャッシュ (pnpm-lock.yaml のみのキー) を汚さないよう、キーを分ける
          cache-dependency-path: |
            pnpm-lock.yaml
            packages-private/${{ matrix.workspace }}/package.json
      - run: pnpm --filter ${{ matrix.workspace }}... install --frozen-lockfile
      # lint = typecheck + eslint
      - run: pnpm --filter ${{ matrix.workspace }} run lint
      # 各パッケージは必ず test スクリプトを持たせる (無いと ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT で落ちる)
      - run: pnpm --filter ${{ matrix.workspace }} run test
